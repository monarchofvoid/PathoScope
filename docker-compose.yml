version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pathoscope-postgres
    environment:
      POSTGRES_DB: pathoscope_db
      POSTGRES_USER: pathoscope
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - pathoscope-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathoscope -d pathoscope_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pathoscope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pathoscope-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathoscope-backend
    environment:
      - DATABASE_URL=postgresql://pathoscope:password@postgres:5432/pathoscope_db
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=["http://localhost:3000", "http://frontend:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pathoscope-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pathoscope-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - pathoscope-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  pathoscope-network:
    driver: bridge